stages:
  - mirror
  - release

# GitLab -> GitHub (espejo inverso). Se ejecuta en push a main/master.
mirror_to_github:
  stage: mirror
  image: alpine:3.20
  only:
    - main
    - master
  variables:
    GIT_STRATEGY: fetch
  script:
    - apk add --no-cache git
    - git config user.name "autoapp-mirror bot"
    - git config user.email "bot@users.noreply.github.com"
    - |
      : "${GH_TOKEN:?Falta la variable GH_TOKEN}"
      : "${GITHUB_USER:?Falta la variable GITHUB_USER}"
      TARGET="https://${GH_TOKEN}@github.com/${GITHUB_USER}/autoapp-mirror.git"
      git remote remove github-mirror 2>/dev/null || true
      git remote add github-mirror "$TARGET"
      git fetch --unshallow 2>/dev/null || git fetch --all
      git push --force github-mirror 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
      echo "Mirror GitLab -> GitHub completado."

# ZIP de release dentro del pipeline de GitLab.
build_zip:
  stage: release
  image: alpine:3.20
  only:
    - tags
  script:
    - apk add --no-cache bash zip
    - chmod +x scripts/build-release.sh
    - ./scripts/build-release.sh "${CI_COMMIT_TAG#v}"
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 30 days
